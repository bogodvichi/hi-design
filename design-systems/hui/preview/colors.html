<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUI · 色彩</title>
    <style>
      body { margin: 0; padding: 32px; background: #f5f5f5; color: rgba(0, 0, 0, 0.7); font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", system-ui, sans-serif; }
      h1 { font-size: 28px; font-weight: 500; margin: 0 0 24px; }
      h2 { font-size: 20px; font-weight: 500; margin: 32px 0 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .sw { background: #fff; border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 6px; overflow: hidden; }
      .chip { height: 72px; }
      .meta { padding: 8px 12px; font-size: 12px; }
      .meta b { display: block; font-weight: 500; color: rgba(0, 0, 0, 0.7); }
      .meta span { color: rgba(0, 0, 0, 0.4); }
    </style>
  </head>
  <body>
    <h1>HUI 色彩</h1>

    <h2>品牌蓝</h2>
    <div class="grid">
      <div class="sw"><div class="chip" style="background:#2080f7"></div><div class="meta"><b>brand / accent</b><span>#2080F7</span></div></div>
      <div class="sw"><div class="chip" style="background:#50a2f9"></div><div class="meta"><b>hover</b><span>#50A2F9</span></div></div>
      <div class="sw"><div class="chip" style="background:#1461cc"></div><div class="meta"><b>active</b><span>#1461CC</span></div></div>
    </div>

    <h2>语义色</h2>
    <div class="grid">
      <div class="sw"><div class="chip" style="background:#1db84c"></div><div class="meta"><b>success</b><span>#1DB84C</span></div></div>
      <div class="sw"><div class="chip" style="background:#ff832b"></div><div class="meta"><b>warning</b><span>#FF832B</span></div></div>
      <div class="sw"><div class="chip" style="background:#e6202a"></div><div class="meta"><b>danger</b><span>#E6202A</span></div></div>
      <div class="sw"><div class="chip" style="background:#176cff"></div><div class="meta"><b>info</b><span>#176CFF</span></div></div>
    </div>

    <h2>中性 / 文字(半透明黑)</h2>
    <div class="grid">
      <div class="sw"><div class="chip" style="background:rgba(0,0,0,.7)"></div><div class="meta"><b>text primary</b><span>rgba(0,0,0,.7)</span></div></div>
      <div class="sw"><div class="chip" style="background:rgba(0,0,0,.5)"></div><div class="meta"><b>text secondary</b><span>rgba(0,0,0,.5)</span></div></div>
      <div class="sw"><div class="chip" style="background:rgba(0,0,0,.4)"></div><div class="meta"><b>text tertiary</b><span>rgba(0,0,0,.4)</span></div></div>
      <div class="sw"><div class="chip" style="background:#f5f5f5"></div><div class="meta"><b>bg</b><span>#F5F5F5</span></div></div>
      <div class="sw"><div class="chip" style="background:#fff;border-bottom:1px solid rgba(0,0,0,.12)"></div><div class="meta"><b>surface</b><span>#FFFFFF</span></div></div>
    </div>
  </body>
</html>
