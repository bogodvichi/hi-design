<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HUI · 字体</title>
    <style>
      body { margin: 0; padding: 32px; background: #f5f5f5; color: rgba(0, 0, 0, 0.7); font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", system-ui, sans-serif; }
      h1 { font-size: 28px; font-weight: 500; margin: 0 0 24px; }
      .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(0, 0, 0, 0.08); }
      .tag { flex: 0 0 200px; color: rgba(0, 0, 0, 0.4); font-size: 12px; }
      .sample { color: rgba(0, 0, 0, 0.7); }
    </style>
  </head>
  <body>
    <h1>HUI 字体与排版</h1>
    <div class="row"><span class="tag">H1 · 28 / 42 / 500</span><span class="sample" style="font-size:28px;line-height:42px;font-weight:500">安防管理平台</span></div>
    <div class="row"><span class="tag">H2 · 22 / 32 / 500</span><span class="sample" style="font-size:22px;line-height:32px;font-weight:500">设备管理</span></div>
    <div class="row"><span class="tag">H3 · 18 / 26 / 500</span><span class="sample" style="font-size:18px;line-height:26px;font-weight:500">视频监控</span></div>
    <div class="row"><span class="tag">H4 · 16 / 24 / 500</span><span class="sample" style="font-size:16px;line-height:24px;font-weight:500">通道配置</span></div>
    <div class="row"><span class="tag">H5 / base · 14 / 20</span><span class="sample" style="font-size:14px;line-height:20px">实时预览与回放</span></div>
    <div class="row"><span class="tag">Body · 14 / 20 / 400</span><span class="sample" style="font-size:14px;line-height:20px;font-weight:400">支持主码流、子码流与第三码流。</span></div>
    <div class="row"><span class="tag">Caption · 12 / 18 / 400</span><span class="sample" style="font-size:12px;line-height:18px;color:rgba(0,0,0,.4)">1~32 个字符,不能包含特殊字符。</span></div>
    <p style="margin-top:24px;font-size:12px;color:rgba(0,0,0,.4)">字体栈:Microsoft YaHei / 微软雅黑 / PingFang SC / system-ui。行高规则:字号 × 1.5,逢单减 1。</p>
  </body>
</html>
