      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh; background: var(--bg); color: var(--fg);
        font-family: var(--font-body); font-size: var(--text-base);
        line-height: var(--leading-body); -webkit-font-smoothing: antialiased;
      }
      @font-face { font-family: "h-icon"; src: url("fonts/h-icon.woff2") format("woff2"), url("fonts/h-icon.ttf") format("truetype"); }
      .icon { font-family: var(--h-font-icon); font-style: normal; line-height: 1; }
      .h-icon-add::before { content: "\ea06"; }
      .h-icon-angle-down::before { content: "\ea1a"; }
      .h-icon-arrow-right::before { content: "\ea33"; }
      .h-icon-alarm::before { content: "\ea09"; }
      .appbar { display: flex; align-items: center; gap: var(--space-4); height: 56px; padding: 0 var(--space-6); background: var(--surface); border-bottom: 1px solid var(--border); }
      .brand { font-weight: 500; color: var(--accent); font-size: var(--text-lg); }
      nav.crumb { display: flex; gap: var(--space-2); color: var(--muted); font-size: var(--text-sm); }
      nav.crumb a { color: var(--muted); text-decoration: none; }
      nav.crumb a:hover { color: var(--accent); }
      .container { max-width: var(--container-max); margin-inline: auto; padding-inline: var(--container-gutter-desktop); }
      section { padding-block: var(--section-y-desktop); }
      @media (max-width: 1023px) { .container { padding-inline: var(--container-gutter-tablet); } section { padding-block: var(--section-y-tablet); } }
      @media (max-width: 639px) { .container { padding-inline: var(--container-gutter-phone); } section { padding-block: var(--section-y-phone); } }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: var(--text-4xl); font-weight: 500; line-height: var(--leading-tight); letter-spacing: var(--tracking-display); }
      h2 { font-size: var(--text-2xl); font-weight: 500; line-height: var(--leading-tight); }
      h3 { font-size: var(--text-lg); font-weight: 500; }
      .eyebrow { color: var(--accent); font-size: var(--text-xs); font-weight: 500; }
      .lead { color: var(--muted); font-size: var(--text-lg); max-width: 640px; }
      .stack > * + * { margin-block-start: var(--space-4); }
      .stack-3 > * + * { margin-block-start: var(--space-3); }
      .stack-4 > * + * { margin-block-start: var(--space-4); }
      .body-muted { color: var(--muted); font-size: var(--text-sm); }
      .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-block-start: var(--space-6); }
      .btn { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-sm); font: 400 var(--text-sm) / 1 var(--font-body); cursor: pointer; transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard); }
      .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .btn-primary { background: var(--accent); color: var(--accent-on); }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-primary:active { background: var(--accent-active); }
      .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
      .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
      .btn-text { background: transparent; color: var(--accent); }
      .btn-danger { background: var(--danger); color: #fff; }
      .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--fg); cursor: pointer; }
      .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elev-raised); overflow: hidden; }
      .card-head { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-soft); }
      .card-body { padding: var(--space-5); }
      .field { display: grid; gap: var(--space-2); margin-block-start: var(--space-4); }
      .field:first-child { margin-block-start: 0; }
      label { color: var(--fg); font-size: var(--text-sm); }
      .req::before { content: "*"; color: var(--danger); margin-inline-end: var(--space-1); }
      input, select { width: 100%; min-height: 32px; padding: 0 var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--fg); font: inherit; }
      input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
      .hint { color: var(--muted); font-size: var(--text-xs); }
      .switch { display: inline-flex; align-items: center; gap: var(--space-2); }
      .switch i { width: 36px; height: 20px; border-radius: var(--radius-pill); background: var(--accent); position: relative; }
      .switch i::after { content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: var(--radius-pill); background: #fff; }
      table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
      th, td { text-align: left; padding: var(--space-3); border-bottom: 1px solid var(--border-soft); }
      th { color: var(--muted); font-weight: 400; background: var(--bg); }
      .badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-2); height: 20px; border-radius: var(--radius-sm); font-size: var(--text-xs); }
      .badge-success { background: color-mix(in oklab, var(--success), transparent 88%); color: var(--success); }
      .badge-danger { background: color-mix(in oklab, var(--danger), transparent 88%); color: var(--danger); }
      .badge-warn { background: color-mix(in oklab, var(--warn), transparent 85%); color: var(--warn); }
      .toast { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--elev-raised); font-size: var(--text-sm); margin-block-start: var(--space-3); }
      .toast.ok { border-left: 3px solid var(--success); }
      .empty { display: grid; place-items: center; gap: var(--space-3); padding: var(--space-12); color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius-md); }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="appbar">
        <span class="brand">HUI</span>
        <nav class="crumb" aria-label="面包屑">
          <a href="#">系统管理</a><span>/</span><a href="#">设备管理</a><span>/</span><span>视频监控</span>
        </nav>
      </header>
      <section>
        <div class="container stack">
          <p class="eyebrow">HUI 设计系统</p>
          <h1>安防管理平台控制台</h1>
          <p class="lead">企业级、数据密集的安防软件界面：品牌蓝主色、紧凑控件、清晰层级。</p>
          <p class="body-muted">基于海康 HUI「蓝」浅色主题 token 构建。</p>
          <div class="actions" aria-label="操作">
            <button class="btn btn-primary"><span class="icon h-icon-add" aria-hidden="true"></span>新增设备</button>
            <button class="btn btn-secondary">导出</button>
            <button class="btn btn-text">取消</button>
            <button class="btn btn-danger">删除</button>
            <button class="icon-btn" aria-label="告警"><span class="icon h-icon-alarm" aria-hidden="true"></span></button>
          </div>
        </div>
      </section>
      <section>
        <div class="container grid">
          <article class="card">
            <div class="card-head"><h3>设备信息</h3></div>
            <div class="card-body">
              <div class="field"><label class="req" for="hui-name">设备名称</label><input id="hui-name" value="IPC-摄像机01" /><span class="hint">1~32个字符；不能包含特殊字符（/ : * ?）。</span></div>
              <div class="field"><label for="hui-type">设备类型</label><select id="hui-type"><option>网络摄像机</option><option>网络球机</option></select></div>
              <div class="field"><span class="switch"><i aria-hidden="true"></i><label>开启录像</label></span></div>
            </div>
          </article>
          <article class="card">
            <div class="card-head"><h3>设备列表</h3><button class="icon-btn" aria-label="展开"><span class="icon h-icon-angle-down" aria-hidden="true"></span></button></div>
            <div class="card-body">
              <table>
                <thead><tr><th>名称</th><th>状态</th></tr></thead>
                <tbody>
                  <tr><td>IPC-01</td><td><span class="badge badge-success">在线</span></td></tr>
                  <tr><td>IPC-02</td><td><span class="badge badge-danger">离线</span></td></tr>
                  <tr><td>NVR-01</td><td><span class="badge badge-warn">升级中</span></td></tr>
                </tbody>
              </table>
            </div>
          </article>
          <article class="card">
            <div class="card-head"><h3>提示与反馈</h3></div>
            <div class="card-body">
              <div class="toast ok"><span class="icon h-icon-add" aria-hidden="true"></span>下发参数成功。</div>
              <div class="toast"><span>加载图片失败，请刷新。</span></div>
              <a class="btn btn-text" href="#">查看详情 <span class="icon h-icon-arrow-right" aria-hidden="true"></span></a>
            </div>
          </article>
        </div>
      </section>
      <section>
        <div class="container">
          <div class="empty"><span class="icon h-icon-alarm" aria-hidden="true"></span><span>暂无数据</span></div>
        </div>
      </section>
    </main>
  </body>
</html>
