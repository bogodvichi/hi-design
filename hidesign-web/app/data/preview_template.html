<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
    }

    /*
     * 侧边栏：默认收起（width: 0），展开时占据左侧空间（非 fixed），
     * 右侧主内容区通过 flex 弹性压缩。
     */
    .sidebar {
      width: 0;
      height: 100vh;
      background: #000000;
      border-right: 1px solid transparent;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease, border-color 0.3s ease;
    }

    .sidebar.expanded {
      width: 260px;
      border-right-color: rgba(255, 255, 255, 0.08);
    }

    /* 防止宽度过渡时内部内容被挤压变形 */
    .sidebar > * {
      min-width: 260px;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header .header-text h3 {
      font-size: 16px;
      font-weight: 600;
      color: #e8e8e8;
      margin: 0;
    }

    .sidebar-header .header-text p {
      font-size: 12px;
      color: #888;
      margin: 4px 0 0;
    }

    /* 统一按钮样式 */
    .icon-btn {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      transition: all 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 8px rgba(100, 180, 255, 0.3);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      list-style: none;
    }

    .sidebar-list::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      color: #c0c0c0;
      user-select: none;
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .sidebar-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-weight: 500;
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.06);
    }

    .sidebar-item .file-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .sidebar-item.active .file-icon {
      opacity: 1;
    }

    .sidebar-item .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-item .home-badge {
      font-size: 11px;
      padding: 2px 6px;
      background: #52c41a;
      color: #fff;
      border-radius: 10px;
      flex-shrink: 0;
      margin-left: 4px;
    }

    /* 主内容区域 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #000000;
    }

    /* 悬浮展开按钮（菜单收起时显示） */
    .fab-btn {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 1001;
      width: 40px;
      height: 40px;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      opacity: 1;
      visibility: visible;
    }

    .fab-btn:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 8px rgba(88, 166, 255, 0.2);
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .fab-btn.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .fab-btn .icon-bar {
      display: block;
      width: 20px;
      height: 2px;
      background: #c0c0c0;
      border-radius: 1px;
      position: relative;
      transition: all 0.3s ease;
    }

    .fab-btn .icon-bar::before,
    .fab-btn .icon-bar::after {
      content: '';
      position: absolute;
      left: 0;
      width: 20px;
      height: 2px;
      background: #c0c0c0;
      border-radius: 1px;
      transition: all 0.3s ease;
    }

    .fab-btn .icon-bar::before {
      top: -6px;
    }

    .fab-btn .icon-bar::after {
      top: 6px;
    }

    /* iframe 容器 */
    .iframe-container {
      width: 100%;
      height: 100%;
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #555;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- 侧边栏菜单（默认收起） -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="header-text">
        <h3>页面列表</h3>
      </div>
      <button class="icon-btn" id="collapseBtn" title="收起菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>
    <ul class="sidebar-list" id="sidebarList"></ul>
  </div>

  <!-- 主内容区域 -->
  <div class="main-content" id="mainContent">
    <!-- 悬浮展开按钮（菜单收起时显示） -->
    <div class="fab-btn" id="fabBtn" title="展开菜单">
      <span class="icon-bar"></span>
    </div>

    <!-- iframe 容器 -->
    <div class="iframe-container" id="iframeContainer">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="18"/>
          <line x1="12" y1="14" x2="12" y2="14.01"/>
        </svg>
        <p>暂无页面数据</p>
      </div>
    </div>
  </div>

  <script>
    // 全局变量：页面文件列表，由后端替换注入
    // eslint-disable-next-line no-unused-vars
    var HTML_FILES = /*HTML_FILES_DATA*/[];

    (function() {
      var sidebar = document.getElementById('sidebar');
      var fabBtn = document.getElementById('fabBtn');
      var collapseBtn = document.getElementById('collapseBtn');
      var sidebarList = document.getElementById('sidebarList');
      var iframeContainer = document.getElementById('iframeContainer');
      var emptyState = document.getElementById('emptyState');

      var currentIframe = null;
      var activeItem = null;

      // 展开菜单：侧边栏进入文档流占据左侧空间，右侧弹性压缩
      function expandMenu() {
        sidebar.classList.add('expanded');
        fabBtn.classList.add('hidden');
      }

      // 收起菜单：侧边栏宽度归零，显示悬浮按钮
      function collapseMenu() {
        sidebar.classList.remove('expanded');
        fabBtn.classList.remove('hidden');
      }

      // 加载页面到 iframe
      function loadPage(filePath, item) {
        // 移除旧的 iframe
        if (currentIframe) {
          currentIframe.remove();
          currentIframe = null;
        }

        // 隐藏空状态
        if (emptyState) {
          emptyState.style.display = 'none';
        }

        // 创建新 iframe
        var iframe = document.createElement('iframe');

        // load 事件需在设置内容前绑定，确保 srcdoc 渲染后能触发
        iframe.addEventListener('load', function() {
          try {
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
            if (doc && doc.title) {
              document.title = doc.title;
            }
          } catch (e) {
            // 跨域 iframe 无法读取，忽略
          }
        });

        // filePath 实际是完整的 HTML 内容字符串，用 srcdoc 嵌入而非 src
        iframe.srcdoc = filePath;
        iframeContainer.appendChild(iframe);
        currentIframe = iframe;

        // 更新选中状态
        if (activeItem) {
          activeItem.classList.remove('active');
        }
        if (item) {
          item.classList.add('active');
          activeItem = item;
        }
      }

      // 渲染菜单列表
      function renderMenu() {
        if (!HTML_FILES || HTML_FILES.length === 0) {
          sidebarList.innerHTML = '<li style="padding: 20px; text-align: center; color: #888; font-size: 13px;">暂无页面</li>';
          return;
        }

        sidebarList.innerHTML = '';
        var homeFile = null;
        var firstItem = null;

        HTML_FILES.forEach(function(file, index) {
          var li = document.createElement('li');
          li.className = 'sidebar-item';
          li.setAttribute('data-path', file.path);
          li.setAttribute('title', file.name);

          // HTML 文件图标 (SVG)
          var iconSvg = '<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

          var homeBadge = '';//file.home ? '<span class="home-badge">首页</span>' : '';
          li.innerHTML = iconSvg + '<span class="file-name">' + file.name + '</span>' + homeBadge;

          // 点击事件 - 不关闭菜单，保持当前状态
          li.addEventListener('click', function() {
            loadPage(file.path, li);
          });

          sidebarList.appendChild(li);

          // 记录首页文件
          if (file.home && !homeFile) {
            homeFile = { path: file.path, item: li };
          }

          // 记录第一个菜单项
          if (index === 0) {
            firstItem = { path: file.path, item: li };
          }
        });

        // 默认选中：优先 home 为 true 的项，否则第一项
        var defaultSelection = homeFile || firstItem;
        if (defaultSelection) {
          loadPage(defaultSelection.path, defaultSelection.item);
        }
      }

      // 事件绑定
      fabBtn.addEventListener('click', expandMenu);
      collapseBtn.addEventListener('click', collapseMenu);

      // 初始化：默认收起菜单，但仍加载默认页面到 iframe
      renderMenu();
      collapseMenu();
    })();
  </script>
</body>
</html>
